<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>koi.summon — 锦鲤召唤终端</title>
<style>
  :root{
    --bg:#070d07; --green:#33ff66; --dim:#1f7a3d; --dim2:#155c2e;
    --text:#b8ffc9; --white:#e8ffe8; --amber:#ffcc55; --red:#ff5566; --cyan:#55ddff; --orange:#ffaa33;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text); overflow:hidden;
    font-family:"SF Mono","Menlo","Consolas","Courier New",monospace; font-size:14px; line-height:1.7;
    text-shadow:0 0 6px rgba(51,255,102,.25); cursor:text;
  }
  /* CRT 扫描线 + 暗角 */
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:99;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  #bar{
    position:fixed; top:0; left:0; right:0; height:34px; z-index:20;
    display:flex; justify-content:space-between; align-items:center; padding:0 14px;
    background:#0a120a; border-bottom:1px solid var(--dim2); color:var(--dim); font-size:12px;
  }
  #bar .t{color:var(--green); font-weight:700}
  #bar .ok{color:var(--green)}
  #out{
    position:fixed; top:34px; bottom:44px; left:0; right:0; overflow-y:auto;
    padding:16px 18px 30px; scrollbar-width:thin; scrollbar-color:var(--dim2) transparent;
  }
  #inrow{
    position:fixed; bottom:0; left:0; right:0; height:44px; z-index:20;
    display:flex; align-items:center; gap:8px; padding:0 18px;
    background:#0a120a; border-top:1px solid var(--dim2);
  }
  #prompt{color:var(--green); font-weight:700; white-space:nowrap}
  #input{
    flex:1; background:transparent; border:none; outline:none; color:var(--white);
    font:inherit; caret-color:transparent;
  }
  #caret{
    display:inline-block; width:9px; height:17px; background:var(--green);
    animation:blink 1s steps(1) infinite; vertical-align:-3px;
  }
  @keyframes blink{50%{opacity:0}}
  .ln{white-space:pre-wrap; word-break:break-all; margin:2px 0}
  .dim{color:var(--dim)} .ok-c{color:var(--green)} .red{color:var(--red)} .amber{color:var(--amber)}
  .cyan{color:var(--cyan)} .white{color:var(--white)} .orange{color:var(--orange)}
  .cmd{color:var(--green)}
  .click{color:var(--cyan); cursor:pointer; text-decoration:underline dotted}
  .click:hover{color:var(--white); background:#123012}
  /* 报告卡片 */
  .card{
    border:1px solid var(--green); background:#081108; padding:12px 16px; margin:12px 0;
    box-shadow:0 0 22px rgba(51,255,102,.12), inset 0 0 40px rgba(0,0,0,.5);
  }
  .card .hd{
    display:inline-block; background:var(--green); color:#041004; font-weight:700;
    padding:1px 10px; margin-bottom:8px; text-shadow:none; letter-spacing:1px;
  }
  .row{margin:3px 0}
  .row .k{color:var(--dim)} .row .v{color:var(--white)}
  .lv{font-size:24px; font-weight:800; letter-spacing:2px}
  .lv-UR{color:var(--amber); text-shadow:0 0 14px rgba(255,204,85,.8)}
  .lv-SSR{color:var(--amber)} .lv-SR{color:var(--cyan)} .lv-R{color:var(--dim)}
  .sw{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin:0 6px 0 2px;border:1px solid #000}
  /* 锦鲤形象游动 */
  .koi-swim{
    position:fixed; z-index:140; pointer-events:none;
    animation:swim var(--dur,4.5s) linear forwards;
  }
  .koi-swim img{
    width:var(--size,110px); display:block;
    filter:drop-shadow(0 0 14px rgba(102,204,255,.45));
    animation:bob var(--bobT,1.2s) ease-in-out infinite alternate;
  }
  @keyframes swim{from{transform:translateX(-340px)}to{transform:translateX(calc(100vw + 340px))}}
  @keyframes bob{from{transform:translateY(-7px) rotate(-4deg)}to{transform:translateY(7px) rotate(4deg)}}
  .mascot-mini{
    height:58px; margin-left:12px; flex:none;
    filter:drop-shadow(0 0 10px rgba(85,221,255,.4));
    animation:bob 1.6s ease-in-out infinite alternate;
  }
  .intrusion-koi{
    position:absolute; right:12px; bottom:10px; width:112px;
    opacity:.16; pointer-events:none; filter:saturate(.55) brightness(1.1);
  }
  /* 片尾全屏守护宣言 */
  #guardOverlay{
    position:fixed; inset:0; z-index:130; display:flex; align-items:center; justify-content:center;
    background:rgba(1,4,3,.96); cursor:pointer; transition:opacity .45s;
  }
  #guardOverlay::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(51,255,102,.05) 0 1px,transparent 1px 4px)}
  #guardOverlay.bye{opacity:0;pointer-events:none}
  .guard-frame{
    position:relative; border:1px solid var(--green); background:#050b06;
    padding:36px 46px; text-align:center;
    box-shadow:0 0 60px rgba(51,255,102,.3), inset 0 0 70px rgba(0,0,0,.6);
    animation:frameFlicker .5s steps(2) infinite;
  }
  @keyframes frameFlicker{50%{box-shadow:0 0 100px rgba(51,255,102,.6), inset 0 0 70px rgba(0,0,0,.6);border-color:var(--amber)}}
  .guard-top{color:var(--red);font-weight:700;letter-spacing:3px;animation:pulse .5s steps(2) infinite}
  .guard-level{display:flex;align-items:center;justify-content:center;gap:18px;margin:18px 0 0;font-size:32px;font-weight:800;letter-spacing:3px;color:var(--red);animation:titleFlash .42s steps(2) infinite}
  .glv-before{color:var(--dim2);text-decoration:line-through}
  .glv-arrow{color:var(--red)}
  .glv-after{color:var(--red);text-shadow:0 0 22px rgba(255,38,74,.95)}
  .glv-badge{display:inline-block;margin-left:14px;padding:4px 12px;border:1px solid var(--red);border-radius:4px;font-size:15px;letter-spacing:4px;color:var(--white);background:rgba(255,38,74,.18);animation:badgeFlash .3s steps(2) infinite}
  @keyframes badgeFlash{0%,49%{opacity:1;background:var(--red);box-shadow:0 0 18px rgba(255,38,74,.9)}50%,100%{opacity:.25;background:rgba(255,38,74,.15);box-shadow:none}}
  .glv-cap{color:var(--dim);font-size:11px;letter-spacing:2px;margin-top:6px}
  .guard-title{
    font-size:clamp(26px,5vw,54px); font-weight:800; color:var(--amber);
    letter-spacing:4px; margin:20px 0 16px; line-height:1.35;
    text-shadow:3px 0 var(--red),-3px 0 var(--cyan),0 0 28px rgba(255,204,85,.65);
    animation:titleFlash .42s steps(2) infinite;
  }
  @keyframes titleFlash{0%{opacity:1}50%{opacity:.5;transform:translateX(2px)}100%{opacity:1}}
  .guard-sub{color:var(--dim);font-size:12px;letter-spacing:2px}
  /* 打飞舞台：大肥鱼冲刺 → 低级锦鲤被击飞 */
  .guard-stage{position:relative;height:104px;margin:6px 0 2px;width:100%}
  .gs-hero{position:absolute;left:4%;bottom:2px;width:92px;transform:translateX(-260px);
    filter:drop-shadow(0 0 14px rgba(51,255,102,.35));
    animation:gsCharge .32s cubic-bezier(.5,0,1,.6) .45s forwards,gsBob 1s ease-in-out 1.2s infinite alternate}
  @keyframes gsCharge{to{transform:translateX(0)}}
  @keyframes gsBob{from{transform:translateX(0) translateY(0)}to{transform:translateX(0) translateY(-6px)}}
  .gs-loser{position:absolute;right:5%;bottom:2px;width:86px;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));
    animation:gsLaunch .95s cubic-bezier(.15,.4,.35,1) .78s forwards}
  @keyframes gsLaunch{
    0%{transform:translate(0,0) rotate(0);opacity:1}
    12%{transform:translate(14px,-34px) rotate(80deg)}
    100%{transform:translate(520px,-240px) rotate(900deg) scale(.25);opacity:0}
  }
  .gs-burst{position:absolute;right:13%;bottom:44px;color:var(--amber);font-weight:800;font-size:26px;
    letter-spacing:2px;opacity:0;text-shadow:0 0 14px var(--amber);animation:gsBurst .45s steps(4) .76s forwards}
  @keyframes gsBurst{0%{opacity:1;transform:scale(.5)}60%{opacity:1;transform:scale(1.35)}100%{opacity:0;transform:scale(1.7)}}
  .gs-cap{font-size:11px;color:var(--dim);letter-spacing:2px;margin-top:2px;opacity:0;animation:gsFade .4s ease 1.6s forwards}
  @keyframes gsFade{to{opacity:1}}
  .glitch{animation:g .18s steps(2) 3}
  @keyframes g{50%{transform:translateX(2px); opacity:.7}}

  /* 黑客入侵 / 锦鲤等级覆写层 */
  #intrusion{
    display:none; position:fixed; inset:0; z-index:120; align-items:center; justify-content:center;
    padding:22px; background:rgba(1,4,3,.94); color:var(--green); text-shadow:0 0 8px rgba(51,255,102,.35);
  }
  #intrusion.on{display:flex; animation:intrudeIn .22s ease-out both}
  @keyframes intrudeIn{from{opacity:0;filter:blur(5px)}to{opacity:1;filter:none}}
  #intrusion::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,0,60,.05) 0 1px,transparent 1px 4px);pointer-events:none}
  .intrusion-panel{position:relative;width:min(720px,100%);border:1px solid var(--red);background:#050b08;box-shadow:0 0 0 1px rgba(255,85,102,.15),0 0 55px rgba(255,38,74,.22),inset 0 0 60px rgba(255,38,74,.04);padding:22px 24px}
  .intrusion-top{display:flex;justify-content:space-between;gap:14px;align-items:center;border-bottom:1px solid rgba(255,85,102,.35);padding-bottom:12px;margin-bottom:17px;color:var(--red);font-weight:700;letter-spacing:1px}
  .intrusion-top .pulse{animation:pulse .65s steps(2) infinite}
  @keyframes pulse{50%{opacity:.25}}
  .intrusion-title{font-size:clamp(20px,4vw,34px);line-height:1.15;color:var(--white);letter-spacing:2px;margin:4px 0 12px;text-shadow:2px 0 var(--red),-2px 0 var(--cyan)}
  .intrusion-sub{color:var(--red);font-size:12px;margin-bottom:15px}
  #intrusionLog{height:126px;overflow:hidden;border:1px solid var(--dim2);background:#020503;padding:10px 12px;color:var(--text);font-size:12px;line-height:1.7}
  .intrusion-logline::before{content:"> ";color:var(--red)}
  .intrusion-logline.ok::after{content:" [OVERRIDE]";color:var(--green)}
  .intrusion-logline.warn::after{content:" [BYPASS]";color:var(--amber)}
  .intrusion-level{display:flex;align-items:center;justify-content:center;gap:18px;margin:21px 0 13px;font-size:26px;font-weight:800;letter-spacing:3px}
  .intrusion-level .before{color:var(--red);text-decoration:line-through;opacity:.8}
  .intrusion-level .arrow{color:var(--amber);animation:arrowPulse .5s steps(2) infinite}
  .intrusion-level .after{color:var(--amber);text-shadow:0 0 18px rgba(255,204,85,.85);animation:levelFlash .24s steps(2) 4}
  @keyframes arrowPulse{50%{opacity:.35}}
  @keyframes levelFlash{50%{opacity:.2;transform:scale(1.08)}}
  .intrusion-progress{height:8px;border:1px solid var(--dim2);background:#071008;overflow:hidden}
  #intrusionBar{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--red),var(--amber),var(--green));box-shadow:0 0 15px var(--green);transition:width .16s linear}
  .intrusion-foot{display:flex;justify-content:space-between;gap:12px;margin-top:11px;color:var(--dim);font-size:11px}
  .intrusion-foot strong{color:var(--green);font-weight:500}
  .glitch-big{animation:gb .5s steps(3) 2}
  @keyframes gb{0%{transform:translate(2px,-1px);filter:hue-rotate(35deg)}50%{transform:translate(-3px,2px);filter:hue-rotate(-45deg) saturate(2.2)}100%{transform:none;filter:none}}
  #alert{position:fixed;inset:0;pointer-events:none;z-index:70}
  #alert.on{animation:af .5s steps(2) 5}
  @keyframes af{0%{box-shadow:inset 0 0 180px rgba(255,60,60,.55)}100%{box-shadow:inset 0 0 60px rgba(255,60,60,0)}}
  .lvl-swap{display:inline-block;animation:sw .6s steps(5)}
  @keyframes sw{0%{opacity:0;transform:scale(1.8)}100%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>

<div id="bar">
  <span><span class="t">koi.summon</span> v1.0 ｜ <span class="ok-c">欧气 KERNEL 已就绪 ●</span></span>
  <span id="clock">--:--:--</span>
</div>

<div id="out"></div>

<div id="inrow">
  <span id="prompt">summon &gt; </span>
  <input id="input" autocomplete="off" spellcheck="false">
  <span id="caret"></span>
</div>

<div id="intrusion" aria-hidden="true">
  <div class="intrusion-panel" role="status" aria-live="assertive">
    <img data-koi class="intrusion-koi" alt="">
    <div class="intrusion-top"><span class="pulse">⚠ SYSTEM BREACH DETECTED</span><span>BLACKHAT // 0xK0I</span></div>
    <div class="intrusion-title">锦鲤等级覆写协议</div>
    <div class="intrusion-sub">外部权限已注入 · 正在劫持欧气内核 · 请勿关闭终端</div>
    <div id="intrusionLog"></div>
    <div class="intrusion-level"><span class="before" id="intrusionBefore">SR</span><span class="arrow">→</span><strong class="after" id="intrusionAfter">SSR</strong></div>
    <div class="intrusion-progress" aria-label="权限提升进度"><span id="intrusionBar"></span></div>
    <div class="intrusion-foot"><span>privilege escalation: <strong id="intrusionPercent">0%</strong></span><span>KOI_CORE // <strong>OVERRIDE</strong></span></div>
  </div>
</div>

      $prompt=document.getElementById('prompt'), $clock=document.getElementById('clock');

const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ============ 确定性哈希（昵称+日期+场景） ============ */
function hashStr(s){let h=5381;for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0}return h>>>0}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function matchPool(name,scene){
  const date=todayStr();
  const scored=POOL.map((k,i)=>{
    const h=hashStr(name+'|'+date+'|'+scene.k+'|'+i);
    const hit=k.tags.filter(t=>scene.tags.includes(t));
    const sortKey=(h%100)+hit.length*14;            // 哈希基分 + 标签命中加分
    const rate=87+((hashStr(name+date+i+'init'))%60)/10;  // 初始 87.0–92.9（R/SR，等待入侵改写）
    return {...k,hit,sortKey,rate:+rate.toFixed(1)};
  });
  scored.sort((a,b)=>b.sortKey-a.sortKey);
  return scored;
}
function levelOf(rate){ return rate>=97?'UR':rate>=93?'SSR':rate>=88?'SR':'R'; }
function barOf(rate){ const n=Math.round((rate-87)/12.9*14); return '█'.repeat(n)+'░'.repeat(14-n); }

const PROMPTS={NAME:'summon &gt; ',SCENE:'选择场景 [1-6] &gt; ',BUSY:'processing…',AGAIN:'summon &gt; '};
function setPrompt(s){ $prompt.innerHTML=s; }
function lock(v){ $in.disabled=v; }

/* ---- FR-01 Boot ---- */
async function boot(){
  lock(true); setPrompt(PROMPTS.BUSY);
  const ok='<span class="dim">[</span><span class="ok-c"> OK </span><span class="dim">]</span>';
  const B=[
    [ok+' init <span class="white">oiki.kernel</span> v3.1.4',160],
    [ok+' mount <span class="cyan">/dev/luck</span> → 欧气核心已加载',200],
    [ok+' loading <span class="white">koi_pool.dat</span> … 128 entries',240],
    [ok+' CRT 扫描线校准 … 完成',140],
    [ok+' 锦鲤信号塔 … <span class="ok-c">在线</span>',180],
    ['',60],
    ['<span class="amber">&gt;&gt; 欢迎来到 KOI.SUMMON 锦鲤召唤终端</span>',240],
    ['<span class="dim">&gt;&gt; 黑客终端风 × 推荐器 × 主题「锦鲤」</span>',200],
    ['<span class="dim">&gt;&gt; 请输入昵称开始匹配，输入 <span class="cmd">help</span> 查看指令</span>',120],
  ];
  for(const [h,d] of B) await line(h,'',d);
  state='NAME'; lock(false); setPrompt(PROMPTS.NAME); $in.focus();
}

/* ---- 场景菜单 ---- */
async function showSceneMenu(){
  state='SCENE'; setPrompt(PROMPTS.SCENE); lock(false);
  await line('',''); 
  await line('<span class="white">选择今日场景：</span>','cmd',120);
  for(const opt of ['<span class="click" data-s="0">[1] 面试</span>   <span class="click" data-s="1">[2] 考试</span>   <span class="click" data-s="2">[3] 表白</span>',
                    '<span class="click" data-s="3">[4] 抽奖</span>   <span class="click" data-s="4">[5] 点外卖</span>  <span class="click" data-s="5">[6] 开工</span>'])
    await line(opt,'',140);
  await line('<span class="dim">&gt;&gt; 输入编号 / 场景名，或直接点击选择</span>','',100);
}
$out.addEventListener('click',e=>{
  const s=e.target.dataset&&e.target.dataset.s;
  if(s!==undefined && state==='SCENE' && !busy) runMatch(SCENES[+s]);
  if(e.target.id==='again' && state==='AGAIN' && !busy) resetToScene();
});

/* ---- FR-03/04 匹配引擎 ---- */
async function runMatch(scene){
  busy=true; state='MATCH'; lock(true); setPrompt(PROMPTS.BUSY);
  await line('');
  await line('<span class="cmd">$ koi-engine --match "'+esc(nick)+'" --scene '+scene.k+'</span>','',260);
  await line('loading <span class="white">koi_pool.dat</span> … 128 entries <span class="ok-c">✓</span>','',320);
  await line('computing similarity <span class="cyan">"'+esc(nick)+'"</span> × <span class="cyan">'+scene.k+'</span> …','',380);
  const top=matchPool(nick,scene).slice(0,3);
  await line('<span class="dim">TOP3 candidates:</span>','',240);
  for(let i=0;i<top.length;i++) await line('&nbsp;&nbsp;#'+(i+1)+' <span class="white">'+top[i].t+'</span> <span class="dim">…</span> <span class="amber">'+top[i].rate+'%</span>','',300);
  await line('<span class="ok-c">MATCH FOUND</span> — confidence <span class="amber">'+top[0].rate+'%</span>','',320);
  await line('');
  await report(top[0],scene);
}

/* ---- FR-05 报告 ---- */
async function report(k,scene){
  state='REPORT'; lock(true); setPrompt(PROMPTS.BUSY);
  const lv=levelOf(k.rate);
  const card=document.createElement('div'); card.className='card glitch';
  const hrow=document.createElement('div'); hrow.style.cssText='display:flex;justify-content:space-between;align-items:center';
  const hd=document.createElement('div'); hd.className='hd'; hd.textContent='KOI REPORT · '+nick+' × '+scene.k;
  const ava=document.createElement('img'); ava.src=KOI_IMG; ava.className='mascot-mini'; ava.alt='锦鲤';
  hrow.appendChild(hd); hrow.appendChild(ava); card.appendChild(hrow); $out.appendChild(card); scroll(); await sleep(300);
  async function row(html){
    const d=document.createElement('div'); d.className='row'; d.innerHTML=html;
    card.appendChild(d); scroll(); await sleep(360); return d;
  }
  const levelRow=await row('<span class="k">锦鲤等级 : </span><span class="lv lv-'+lv+'">'+lv+'</span>');
  const rateRow=await row('<span class="k">匹配度&nbsp;&nbsp; : </span><span class="amber">'+k.rate+'%</span> <span class="dim">'+barOf(k.rate)+'</span>');
  await row('<span class="k">推荐锦鲤 : </span><span class="white">'+k.t+'</span>');
  await row('<span class="k">幸运色&nbsp;&nbsp; : </span><span class="sw" style="background:'+k.c[1]+'"></span><span class="white">'+k.c[0]+' '+k.c[1]+'</span>');
  await row('<span class="k">幸运数字 : </span><span class="amber">'+k.n+'</span><span class="k">&nbsp;&nbsp;&nbsp;幸运方位 : </span><span class="amber">'+k.dir+'</span>');
  await row('<span class="k">推荐行动 : </span><span class="ok-c">'+k.act+'</span>');
  await row('<span class="k">今日忌讳 : </span><span class="red">'+k.tab+'</span>');
  await row('<span class="k">锦鲤语录 : </span><span class="cyan">「'+k.q+'」</span>');
  const reason = k.hit.length
    ? '「'+k.t+'」与你的「'+scene.k+'」场景频率共振（命中标签：'+k.hit.join('/')+'），锦鲤池 128 次遍历 TOP1 命中。'
    : '「'+k.t+'」与昵称哈希发生欧气纠缠，锦鲤池 128 次遍历后 TOP1 命中。';
  await row('<span class="k">推荐理由 : </span><span class="dim">'+reason+'</span>');
  await sleep(800);
  const hackedLv=await intrude(card,levelRow,rateRow,k,scene);
  await line('');
  await line('<span class="ok-c">&gt;&gt; 锦鲤已投递至你的今日时间线。</span>','',300);
  await line('<span class="click" id="again">[ SUMMON AGAIN ]</span> <span class="dim">回车或点击重新匹配 ｜ 输入</span> <span class="cmd">name &lt;新昵称&gt;</span> <span class="dim">换人</span>','',100);
  state='AGAIN'; busy=false; setPrompt(PROMPTS.AGAIN);
  swimKoi();
  showGuard(levelOf(k.rate),hackedLv);
}
/* ---- 入侵彩蛋：强制改写等级至 SSR+ ---- */
async function intrude(card,levelRow,rateRow,k,scene){
  const al=document.createElement('div'); al.id='alert'; document.body.appendChild(al); al.classList.add('on');
  await line('');
  await line('<span class="red">&gt;&gt; WARNING: UNAUTHORIZED ACCESS DETECTED — 127.0.0.1</span>','',280);
  await line('<span class="red">&gt;&gt; 目标锁死：本次锦鲤等级 ｜ 防火墙：FORTUNE-DAEMON v9</span>','',220);
  await line('<span class="cmd">$ sudo exploit --bypass fortune-daemon --inject-luck 9999 --target "'+esc(nick)+'"</span>','',320);
  const newRate=+(93+(hashStr(nick+todayStr()+scene.k+'hack')%70)/10).toFixed(1);
  const newLv=levelOf(newRate);
  await playIntrusionOverlay(levelOf(k.rate),newLv,newRate);
  await line('<span class="ok-c">ACCESS GRANTED</span> <span class="dim">— privilege escalated: root@koi</span>','',260);
  await line('<span class="red">OVERWRITE</span> koi_level: <span class="dim">'+levelOf(k.rate)+'</span> → <span class="amber">'+newLv+'</span> <span class="dim">｜ match '+newRate+'%</span>','',340);
  card.classList.add('glitch-big'); await sleep(650);
  levelRow.innerHTML='<span class="k">锦鲤等级 : </span><span class="lv lv-'+newLv+' lvl-swap">'+newLv+'</span><span class="dim"> ← 已被入侵改写</span>';
  rateRow.innerHTML='<span class="k">匹配度&nbsp;&nbsp; : </span><span class="amber">'+newRate+'%</span> <span class="dim">'+barOf(newRate)+'</span>';
  scroll(); await sleep(650);
  card.classList.remove('glitch-big'); al.remove();
  await line('<span class="amber">&gt;&gt; 欧气注入完成 — 等级已强制提升至 '+newLv+'，本终端已被锦鲤接管。</span>','',260);
  return newLv;
}
async function playIntrusionOverlay(fromLevel,toLevel,newRate){
  const overlay=document.getElementById('intrusion');
  const log=document.getElementById('intrusionLog');
  const bar=document.getElementById('intrusionBar');
  const percent=document.getElementById('intrusionPercent');
  document.getElementById('intrusionBefore').textContent=fromLevel;
  document.getElementById('intrusionAfter').textContent=toLevel;
  log.innerHTML=''; bar.style.width='0%'; percent.textContent='0%';
  overlay.classList.add('on'); overlay.setAttribute('aria-hidden','false');
  const steps=[
    ['opening backdoor into koi_core.mem','warn'],
    ['bypassing luck checksum / 0xK0I','warn'],
    ['injecting elevated rarity signature','ok'],
    ['rewriting grade matrix: '+fromLevel+' → '+toLevel+' / match '+newRate+'%','ok'],
    ['access granted · report mutation complete','ok']
  ];
  for(let i=0;i<steps.length;i++){
    const entry=document.createElement('div'); entry.className='intrusion-logline '+steps[i][1]; entry.textContent=steps[i][0]; log.appendChild(entry); log.scrollTop=log.scrollHeight;
    const pct=Math.round(((i+1)/steps.length)*100); bar.style.width=pct+'%'; percent.textContent=pct+'%';
    await sleep(380);
  }
  await sleep(820);
  overlay.classList.remove('on'); overlay.setAttribute('aria-hidden','true');
  await sleep(180);
}
function swimKoi(){
  /* 「最强」锦鲤编队：一大五小，错峰游过屏幕 */
  const cfg=[
    {top:'50%',size:136,dur:4200,bobT:1000},
    {top:'70%',size:92,dur:5400,bobT:1300},
    {top:'34%',size:66,dur:6400,bobT:1500},
    {top:'62%',size:110,dur:4900,bobT:1100},
    {top:'26%',size:78,dur:5800,bobT:1400},
    {top:'44%',size:56,dur:7000,bobT:1600},
  ];
  cfg.forEach((c,i)=>setTimeout(()=>{
    const w=document.createElement('div'); w.className='koi-swim';
    w.style.top=c.top;
    w.style.setProperty('--size',c.size+'px');
    w.style.setProperty('--dur',c.dur+'ms');
    w.style.setProperty('--bobT',c.bobT+'ms');
    const img=document.createElement('img'); img.src=KOI_IMG; img.alt='锦鲤';
    w.appendChild(img); document.body.appendChild(w);
    w.addEventListener('animationend',()=>w.remove());
  }, i*450));
}

/* ---- 片尾全屏守护宣言 ---- */
function showGuard(beforeLv,afterLv){
  hideGuard();
  const g=document.createElement('div'); g.id='guardOverlay';
  g.innerHTML='<div class="guard-frame">'+
    '<div class="guard-top">⚠ GUARDIAN PROTOCOL // ACTIVE</div>'+
    '<div class="guard-level"><span class="glv-before">'+esc(beforeLv||'R')+'</span><span class="glv-arrow">→</span><span class="glv-after">'+esc(afterLv||'UR')+'</span><span class="glv-badge">⚠ 已入侵</span></div>'+
    '<div class="glv-cap">koi_level OVERRIDE // RANK FORCED UPGRADE</div>'+
    '<div class="guard-stage"><img class="gs-hero" alt="大肥鱼"><img class="gs-loser" alt="低级锦鲤"><div class="gs-burst">★ !!</div></div>'+
    '<div class="gs-cap">LOW-RANK KOI ELIMINATED // 低级锦鲤已被大肥鱼打飞</div>'+
    '<div class="guard-title">由大肥鱼守护你今天的运势</div>'+
    '<div class="guard-sub">DAFEIYU.EXE 已驻留欧气内核 · 护盾 24h 生效 · 点击任意处继续</div>'+
  '</div>';
  document.body.appendChild(g);
  const hero=g.querySelector('.gs-hero'), loser=g.querySelector('.gs-loser');
  if(hero) hero.src=KOI_IMG; if(loser) loser.src=KOI_LOSER;
  lock(true);
  let closed=false;
  const close=()=>{
    if(closed) return; closed=true;
    document.removeEventListener('keydown',onKey);
    g.classList.add('bye');
    setTimeout(()=>{ g.remove(); if(state==='AGAIN'&&!busy){ lock(false); setPrompt(PROMPTS.AGAIN); $in.focus(); } },480);
  };
  const onKey=e=>{ if(e.key==='Enter'||e.key==='Escape'||e.key===' ') close(); };
  document.addEventListener('keydown',onKey);
  g.addEventListener('click',close);
  setTimeout(close, 5200);
}
function hideGuard(){
  document.querySelectorAll('#guardOverlay').forEach(g=>g.remove());
}

/* ---- FR-06 重来 ---- */
function resetToScene(){
  hideGuard();
  $out.innerHTML='';
  line('<span class="dim">-- session restarted --</span>','',120);
  showSceneMenu();
}

/* ---- FR-02 输入处理 ---- */
async function onEnter(){
  if(busy||$in.disabled) return;
  const raw=$in.value; $in.value='';
  const v=raw.trim();
  if(state==='NAME'){
    if(!v){ await line('<span class="red">usage: summon --name &lt;nickname&gt;</span>','',140); return; }
    nick=v;
    if(v.length>12){ nick=v.slice(0,12); await line('<span class="amber">warn: 昵称超过 12 字符，已截断为「'+esc(nick)+'」</span>','',160); }
    await line('<span class="cmd">summon &gt; '+esc(raw)+'</span>','',80);
    await line('<span class="ok-c">&gt;&gt; 昵称已确认：</span><span class="white">'+esc(nick)+'</span> <span class="dim">｜ 欧气签名 '+hashStr(nick+todayStr()).toString(16).slice(0,8)+'</span>','',220);
    showSceneMenu();
  }
  else if(state==='SCENE'){
    let idx=SCENES.findIndex((s,i)=>v===String(i+1)||v===s.k);
    if(idx<0){ await line('<span class="red">error: 未知场景「'+esc(v)+'」— 请输入 1-6 或场景名</span>','',140); return; }
    runMatch(SCENES[idx]);
  }
  else if(state==='AGAIN'){
    const m=v.match(/^name\s+(.+)/);
    if(m){
      let nn=m[1].trim();
      if(!nn){ await line('<span class="red">usage: name &lt;新昵称&gt;</span>','',140); return; }
      if(nn.length>12){ nn=nn.slice(0,12); await line('<span class="amber">warn: 昵称已截断为「'+esc(nn)+'」</span>','',160); }
      nick=nn;
      await line('<span class="ok-c">&gt;&gt; 昵称已切换：</span><span class="white">'+esc(nick)+'</span>','',180);
      resetToScene();
    } else {
      await line('<span class="cmd">summon &gt; '+esc(raw)+'</span>','',80);
      resetToScene();
    }
  }
}
$in.addEventListener('keydown',e=>{ if(e.key==='Enter') onEnter(); });

/* ---- help ---- */
const HELP=[
 '<span class="white">可用指令：</span>',
 '&nbsp;&nbsp;<span class="cmd">help</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;查看本帮助',
 '&nbsp;&nbsp;<span class="cmd">name &lt;昵称&gt;</span>&nbsp;&nbsp;更换昵称（报告页可用）',
 '&nbsp;&nbsp;<span class="cmd">1-6 / 场景名</span>&nbsp;&nbsp;选择今日场景',
 '&nbsp;&nbsp;<span class="cmd">回车</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;在报告页 = SUMMON AGAIN',
];

/* 重写 onEnter 中 help 支持：包一层 */
const _onEnter=onEnter;
onEnter=async function(){
  if((state==='NAME'||state==='SCENE')&&$in.value.trim()==='help'){
    const raw=$in.value; $in.value='';
    await line('<span class="cmd">summon &gt; '+esc(raw)+'</span>','',80);
    for(const h of HELP) await line(h,'',90);
    return;
  }
  return _onEnter();
};

boot();
</script>
